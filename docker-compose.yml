# HostMode Agent Docker Compose
# Usage: docker-compose up -d

version: '3.8'

services:
  hostmode:
    build:
      context: .
      dockerfile: Dockerfile
    image: hostmode-agent:local
    container_name: hostmode
    restart: unless-stopped

    environment:
      # Required: Your license key from hostmode.net
      - HOSTMODE_LICENSE_KEY=${HOSTMODE_LICENSE_KEY}

      # Optional: Override cloud URL (for testing/self-hosted)
      # - HOSTMODE_CLOUD_URL=https://hostmode.net

      # Optional: Timezone
      - TZ=${TZ:-UTC}

    volumes:
      # Server data (world files, plugins, etc.)
      - ./data:/data

      # Configuration files
      - ./config:/config

    # Use host networking so agent can reach local services
    network_mode: host

    # ports:
    #   # Minecraft server ports
    #   # Adjust based on your server configuration
    #   - "25565-25574:25565-25574"

    # Resource limits (adjust based on your server needs)
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 2G

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# Optional: Create named volumes instead of bind mounts
# volumes:
#   hostmode-data:
#   hostmode-config:
